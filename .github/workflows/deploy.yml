name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js for Astro build
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Astro dependencies
        working-directory: ./astro-site
        run: npm ci
      
      - name: Build Astro site
        working-directory: ./astro-site
        run: npm run build
      
      - name: Prepare deployment files
        run: |
          cp -r astro-site/dist/* www/slash/ 2>/dev/null || true
          cd www && tar -czf ../deploy.tar.gz . && cd ..
          echo "Deployment package created"
      
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH key setup complete"
      
      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo 'SSH connection successful'"
      
      - name: Deploy via SSH (tar + sudo)
        run: |
          cat deploy.tar.gz | ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            sudo mkdir -p /usr/share/nginx/html
            sudo tar -xzf - -C /usr/share/nginx/html/
            sudo chown -R root:admin /usr/share/nginx/html/
            sudo chmod -R 755 /usr/share/nginx/html/
            sudo systemctl reload nginx
            echo 'Deployment completed successfully'
          "
