name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js for Astro build
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Astro dependencies
        working-directory: ./astro-site
        run: npm ci
      
      - name: Build Astro site
        working-directory: ./astro-site
        run: npm run build
      
      - name: Prepare deployment files
        run: |
          cp -r astro-site/dist/* www/slash/ 2>/dev/null || true
      
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY_BASE64 }}
      
      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p ${{ secrets.SERVER_PORT }}" \
            www/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/usr/share/nginx/html/
      
      - name: Run remote commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY_BASE64 }}
          script: |
            sudo chown -R root:admin /usr/share/nginx/html/
            sudo chmod -R 755 /usr/share/nginx/html/
            sudo systemctl reload nginx
            echo "Deployment completed at $(date)"
