name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js for Astro build
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Astro dependencies
        working-directory: ./astro-site
        run: npm ci
      
      - name: Build Astro site
        working-directory: ./astro-site
        run: npm run build
      
      - name: Prepare deployment files
        run: |
          cp -r astro-site/dist/* www/slash/ 2>/dev/null || true
      
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH key setup complete"
      
      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "echo 'SSH connection successful'"
      
      - name: Deploy via scp (to temp directory)
        run: |\n          scp -i ~/.ssh/deploy_key -P ${{ secrets.SERVER_PORT }} -r www/ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/www-deploy-temp/\n          echo "SCP deployment to temp directory complete"
      
      - name: Remote commands (move files with sudo)
        run: |\n          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "\n            echo 'Moving files to nginx directory...'\n            sudo rm -rf /usr/share/nginx/html/*\n            sudo cp -r ~/www-deploy-temp/* /usr/share/nginx/html/\n            sudo chown -R root:admin /usr/share/nginx/html/\n            sudo chmod -R 755 /usr/share/nginx/html/\n            sudo systemctl reload nginx\n            rm -rf ~/www-deploy-temp/\n            echo 'Deployment completed successfully'\n          "
